<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderno e Simples</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        #bloco {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            top: 200px;
            left: 200px;
        }
    </style>
</head>
<body>

    <div id="bloco"></div>

    <script>
        const bloco = document.getElementById('bloco');
        
        // Variáveis simples e diretas
        let x = 200;
        let y = 200;
        const velocidade = 6;

        // O jeito mais simples e moderno de guardar as teclas pressionadas
        const teclas = {};

        // Quando aperta a tecla, ela vira "true" dentro do objeto
        window.addEventListener('keydown', (e) => teclas[e.key.toLowerCase()] = true);

        // Quando solta a tecla, ela deixa de ser "true" (deletamos ela)
        window.addEventListener('keyup', (e) => delete teclas[e.key.toLowerCase()]);

        // Loop do jogo ultra simples e limpo
        const loop = () => {
            if (teclas.w) y -= velocidade;
            if (teclas.s) y += velocidade;
            if (teclas.a) x -= velocidade;
            if (teclas.d) x += velocidade;

            // Atualiza a tela usando o padrão moderno de crases (Template Strings)
            bloco.style.top = `${y}px`;
            bloco.style.left = `${x}px`;

            requestAnimationFrame(loop);
        };

        // Inicia o movimento suave
        loop();
    </script>
</body>
</html>
