<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo com Inventário FIFO (Modernizado)</title>
    <style>
        body { margin: 0; overflow: hidden; height: 100vh; background-color: #e5e5e5; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif;}
        #cenario { position: absolute; width: 100vw; height: 100vh; background-image: linear-gradient(to right, #ccc 1px, transparent 1px), linear-gradient(to bottom, #ccc 1px, transparent 1px); background-size: 40px 40px; }
        
        #bloco { width: 50px; height: 50px; background-color: blue; z-index: 10; }
        #obstaculo { width: 80px; height: 80px; background-color: red; position: absolute; z-index: 5; left: 0; top: 0; }
        
        /* Interface do Inventário */
        #ui-inventario { position: absolute; top: 20px; left: 20px; background: white; border: 2px solid black; padding: 10px; z-index: 20; min-width: 150px; font-weight: bold;}
        #lista-itens { list-style: none; padding: 0; margin: 10px 0 0 0; }
        #lista-itens li { padding: 5px; margin-bottom: 5px; border-radius: 4px; color: white; text-align: center; text-shadow: 1px 1px 2px black;}
        
        /* Container para desenhar os itens no chão */
        #chao { position: absolute; width: 100vw; height: 100vh; z-index: 4; }
        .item-chao { width: 30px; height: 30px; border-radius: 50%; position: absolute; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5); left: 0; top: 0; }
    </style>
</head>
<body>
    <div id="ui-inventario">
        Inventário (FIFO)
        <ul id="lista-itens"></ul>
        <small style="font-weight:normal; font-size:12px;">E = Coletar | Q = Largar</small>
    </div>

    <div id="cenario"></div>
    <div id="chao"></div>
    <div id="obstaculo"></div>
    <div id="bloco"></div>

    <script>
        const cenario = document.getElementById('cenario');
        const obstaculo = document.getElementById('obstaculo');
        const chao = document.getElementById('chao');
        const listaUI = document.getElementById('lista-itens');

        let x = 0, y = 0;
        const velocidade = 6;
        const tamanhoJogador = 50;
        const obs = { x: 200, y: 100, largura: 80, altura: 80 };

        // --- SISTEMA DE INVENTÁRIO E ITENS ---
        const inventario = []; 
        const raioColeta = 60; 
        
        let itensNoMapa = [
            { nome: 'Moeda de Ouro', cor: 'gold', x: 300, y: 0 },
            { nome: 'Cristal Roxo', cor: 'purple', x: -200, y: 150 },
            { nome: 'Esmeralda', cor: 'green', x: 100, y: -250 }
        ];

        const teclas = {};

        // Atualiza a tela de UI do inventário usando .map() e .join() (Adeus innerHTML em loop)
        const atualizarInventarioUI = () => {
            listaUI.innerHTML = inventario.length 
                ? inventario.map(item => `<li style="background-color: ${item.cor};">${item.nome}</li>`).join('')
                : '<li style="color:black; font-weight:normal;">Vazio</li>';
        };
        atualizarInventarioUI();

        // Window Events com desestruturação ({ key })
        window.addEventListener('keydown', ({ key }) => {
            const tecla = key.toLowerCase();
            teclas[tecla] = true;

            if (tecla === 'e') {
                // Usa findIndex e Math.hypot em vez do for e cálculo manual de Pitágoras
                const index = itensNoMapa.findIndex(item => 
                    Math.hypot((x + 25) - (item.x + 15), (y + 25) - (item.y + 15)) <= raioColeta
                );

                if (index !== -1) {
                    inventario.push(...itensNoMapa.splice(index, 1)); // Remove do mapa e joga no fim da fila
                    atualizarInventarioUI();
                }
            }

            if (tecla === 'q' && inventario.length > 0) {
                // Remove o PRIMEIRO (Shift) e já mescla as coordenadas novas (x, y) com Spread Operator
                itensNoMapa.push({ ...inventario.shift(), x, y }); 
                atualizarInventarioUI();
            }
        });
        
        window.addEventListener('keyup', ({ key }) => delete teclas[key.toLowerCase()]);

        const loop = () => {
            let proximoX = x + (teclas.d ? velocidade : 0) - (teclas.a ? velocidade : 0);
            let proximoY = y + (teclas.s ? velocidade : 0) - (teclas.w ? velocidade : 0);

            const bateuNoObstaculo =
                proximoX < obs.x + obs.largura && proximoX + tamanhoJogador > obs.x &&
                proximoY < obs.y + obs.altura && proximoY + tamanhoJogador > obs.y;

            if (!bateuNoObstaculo) {
                x = proximoX;
                y = proximoY;
            }

            // Otimização de Performance: Usando Transform / Translate em vez de Top/Left
            cenario.style.backgroundPosition = `${-x}px ${-y}px`;

            const telaCentroX = window.innerWidth / 2;
            const telaCentroY = window.innerHeight / 2;

            obstaculo.style.transform = `translate(${telaCentroX - (tamanhoJogador / 2) + (obs.x - x)}px, ${telaCentroY - (tamanhoJogador / 2) + (obs.y - y)}px)`;

            // --- DESENHANDO OS ITENS NO CHÃO COM TEMPLATE LITERALS ---
            // Substitui totalmente o document.createElement() por uma geração de string declarativa
            chao.innerHTML = itensNoMapa.map(item => `
                <div class="item-chao" style="
                    background-color: ${item.cor}; 
                    transform: translate(${telaCentroX - (tamanhoJogador / 2) + (item.x - x)}px, ${telaCentroY - (tamanhoJogador / 2) + (item.y - y)}px);">
                </div>
            `).join('');

            requestAnimationFrame(loop);
        };

        loop();
    </script>
</body>
</html>
