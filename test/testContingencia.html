<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Mecânicas - Dashboard Completo</title>
    <style>
        /* RESET E FUNDO */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h2 {
            font-size: 1rem;
            color: #aaaaaa;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        p { margin: 8px 0; font-size: 0.9rem; }

        /* MENSAGEM DE STATUS E RESTART */
        #status-container { margin-bottom: 15px; }
        #status-msg { color: red; font-weight: bold; font-size: 20px; margin: 0; }
        #btn-restart {
            display: none;
            background-color: #880000;
            margin: 15px auto 0 auto;
            border-color: #ff5555;
            max-width: 300px;
        }
        #btn-restart:hover { background-color: #aa0000; }

        /* LAYOUT DASHBOARD (CSS GRID) */
        .container-paineis {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .painel {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        @media (min-width: 600px) {
            .container-paineis { grid-template-columns: 1fr 1fr; }
            .painel-energia { grid-column: 1 / -1; }
        }

        /* BARRAS E BOTÕES */
        progress { width: 100%; height: 15px; }
        
        button {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 5px;
            width: 100%;
        }
        
        button:hover:not(:disabled) { background-color: #666; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        input[type="text"] {
            background-color: #111;
            color: #00ff00;
            border: 1px solid #555;
            padding: 8px;
            font-family: inherit;
            text-align: center;
            font-size: 16px;
            width: 120px;
        }
    </style>
</head>
<body id="tela-jogo">

    <div id="status-container">
        <p id="status-msg"></p>
        <button id="btn-restart" onclick="location.reload()">REINICIAR SIMULAÇÃO</button>
    </div>

    <div class="container-paineis">
        <!-- PAINEL O2 -->
        <div class="painel">
            <h2>Mecânica 1: Suporte de Vida</h2>
            <p>Nível de Oxigênio: <span id="o2-valor">100</span>%</p>
            <progress id="o2-barra" value="100" max="100"></progress>
            <button id="btn-valvula" onclick="girarValvula()">Girar Válvula (+20%)</button>
        </div>

        <!-- PAINEL ÁGUA -->
        <div class="painel">
            <h2>Mecânica 3: Pressão/Água</h2>
            <p>Nível de Água: <span id="agua-valor">0</span>%</p>
            <progress id="agua-barra" value="0" max="100" style="accent-color: blue;"></progress>
            <button id="btn-bomba" onclick="drenarAgua()">Bomba de Drenagem (-30%)</button>
        </div>

        <!-- PAINEL ENERGIA -->
        <div class="painel painel-energia">
            <h2>Mecânica 2: LME (Energia Principal)</h2>
            <p>Status da Rede: <strong id="energia-status" style="color: green;">LIGADA</strong></p>
            
            <div id="painel-reparo" style="display: none; background: #111; padding: 10px; border: 1px solid red; margin-top: 10px;">
                <p style="color: #ff5555; font-weight: bold; margin-top: 0;">FALHA EM CASCATA!</p>
                <p>Código de Reboot: <strong id="codigo-gerado" style="color: yellow; font-size: 16px; letter-spacing: 2px;">----</strong></p>
                <input type="text" id="input-codigo" placeholder="Digite..." autocomplete="off">
                <button onclick="tentarReboot()" style="width: auto;">Executar</button>
                <p id="msg-erro-reboot" style="color: #ff5555; font-size: 12px; margin: 5px 0 0 0;"></p>
            </div>
        </div>
    </div>

    <script>
        let oxigenio = 100;
        let nivelAgua = 0;
        let energiaLigada = true;
        let jogoAtivo = true;
        let codigoAtual = ""; 
        
        const telaJogo = document.getElementById('tela-jogo');
        const statusMsg = document.getElementById('status-msg');
        const btnRestart = document.getElementById('btn-restart');
        
        const displayO2 = document.getElementById('o2-valor');
        const barraO2 = document.getElementById('o2-barra');
        const btnValvula = document.getElementById('btn-valvula');
        
        const displayAgua = document.getElementById('agua-valor');
        const barraAgua = document.getElementById('agua-barra');
        const btnBomba = document.getElementById('btn-bomba');

        const energiaStatus = document.getElementById('energia-status');
        const painelReparo = document.getElementById('painel-reparo');
        const displayCodigo = document.getElementById('codigo-gerado');
        const inputCodigo = document.getElementById('input-codigo');
        const msgErroReboot = document.getElementById('msg-erro-reboot');

        // LOOP DE O2
        const loopOxigenio = setInterval(() => {
            if (!jogoAtivo) return;
            let taxaQueda = energiaLigada ? 5 : 10; 
            oxigenio -= taxaQueda;
            if (oxigenio <= 0) encerrarJogo("FALHA CRÍTICA: ASFIXIA!");
            atualizarInterfaceO2();
        }, 1000);

        // LOOP DA ÁGUA
        const loopAgua = setInterval(() => {
            if (!jogoAtivo) return;
            let chanceSubir = energiaLigada ? 0.4 : 0.7;
            let volumeAgua = energiaLigada ? 10 : 20;
            if (Math.random() < chanceSubir) nivelAgua += volumeAgua;
            if (nivelAgua >= 100) encerrarJogo("FALHA CRÍTICA: COLAPSO ESTRUTURAL!");
            atualizarInterfaceAgua();
        }, 1500);

        // LOOP DE ENERGIA
        const loopEnergia = setInterval(() => {
            if (!jogoAtivo) return;
            if (energiaLigada && Math.random() < 0.25) { 
                energiaLigada = false;
                
                telaJogo.style.backgroundColor = "#111111";
                energiaStatus.innerText = "SISTEMA OFFLINE";
                energiaStatus.style.color = "red";
                
                btnValvula.disabled = true; 
                btnBomba.disabled = true;
                
                codigoAtual = Math.floor(1000 + Math.random() * 9000).toString();
                displayCodigo.innerText = codigoAtual;
                
                painelReparo.style.display = "block";
                inputCodigo.value = "";
                msgErroReboot.innerText = "";
            }
        }, 2000);

        function girarValvula() {
            if (oxigenio > 0 && energiaLigada) {
                oxigenio = Math.min(100, oxigenio + 20);
                atualizarInterfaceO2();
            }
        }

        function drenarAgua() {
            if (nivelAgua > 0 && energiaLigada) {
                nivelAgua = Math.max(0, nivelAgua - 30);
                atualizarInterfaceAgua();
            }
        }

        function tentarReboot() {
            if (!jogoAtivo) return;
            if (inputCodigo.value === codigoAtual) {
                energiaLigada = true;
                telaJogo.style.backgroundColor = ""; 
                energiaStatus.innerText = "LIGADA";
                energiaStatus.style.color = "green";
                
                btnValvula.disabled = false;
                btnBomba.disabled = false;
                painelReparo.style.display = "none"; 
            } else {
                msgErroReboot.innerText = "CÓDIGO INVÁLIDO!";
                inputCodigo.value = ""; 
                inputCodigo.focus();    
            }
        }

        function encerrarJogo(mensagem) {
            jogoAtivo = false;
            oxigenio = Math.max(0, oxigenio);
            nivelAgua = Math.min(100, nivelAgua);
            atualizarInterfaceO2();
            atualizarInterfaceAgua();
            
            statusMsg.innerText = mensagem;
            btnRestart.style.display = "block"; // MOSTRA O BOTÃO NOVO
            
            btnValvula.disabled = true;
            btnBomba.disabled = true;
            painelReparo.style.display = "none"; 
        }

        function atualizarInterfaceO2() {
            displayO2.innerText = oxigenio;
            barraO2.value = oxigenio;
        }

        function atualizarInterfaceAgua() {
            displayAgua.innerText = nivelAgua;
            barraAgua.value = nivelAgua;
        }
    </script>
</body>
</html>
