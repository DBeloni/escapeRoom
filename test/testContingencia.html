<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste Mecânicas - O2, Energia, Água e Cascata</title>
    <style>
        /* RESET E FUNDO */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s;
            /* Deixa o blackout mais suave */
        }

        h2 {
            font-size: 1.2rem;
            color: #aaaaaa;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .painel {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin: 15px auto;
            max-width: 450px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        /* BOTÕES E INPUTS */
        button {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background-color: #666;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        input[type="text"] {
            background-color: #111;
            color: #00ff00;
            border: 1px solid #555;
            padding: 8px;
            font-family: inherit;
            text-align: center;
            font-size: 16px;
        }

        /* LAYOUT RESPONSIVO (O segredo da modularidade) */
    .container-paineis {
        display: flex;
        flex-wrap: wrap; /* Permite quebrar a linha se a tela for pequena */
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Ajustamos o painel do Commit 2 para funcionar no Flexbox */
    .painel {
        background-color: #2a2a2a;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 20px;
        flex: 1 1 300px; /* Cresce, encolhe e tem base de 300px (ideal celular) */
        max-width: 350px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        box-sizing: border-box;
    }

    /* BOTÕES E INPUTS INDUSTRIAIS */
    button {
        background-color: #444;
        color: #fff;
        border: 1px solid #666;
        border-radius: 4px;
        padding: 10px 15px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        transition: 0.2s;
        margin-top: 10px;
        width: 100%; /* Ocupa a largura total do painel no celular */
    }
    
    button:hover:not(:disabled) { background-color: #666; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    input[type="text"] {
        background-color: #111;
        color: #00ff00;
        border: 1px solid #555;
        padding: 8px;
        font-family: inherit;
        text-align: center;
        font-size: 16px;
        width: 100px;
    }
    </style>
</head>

<body id="tela-jogo">
    <div class="container-paineis">
        <div class="painel">
            <h2>Mecânica 1: Suporte de Vida (O2)</h2>
            <p>Nível de Oxigênio: <span id="o2-valor">100</span>%</p>
            <progress id="o2-barra" value="100" max="100" style="width: 300px;"></progress>
            <br><br>
            <button id="btn-valvula" onclick="girarValvula()">Girar Válvula de O2 (+20%)</button>

            <p id="status-msg" style="color: red; font-weight: bold; font-size: 20px;"></p>

        </div>

        <hr>


        <div class="painel">
            <h2>Mecânica 2: LME (Energia / Blackout)</h2>
            <p>Status da Energia: <strong id="energia-status" style="color: green;">LIGADA</strong></p>

            <div id="painel-reparo"
                style="display: none; background: #333; padding: 15px; width: 270px; color: white; border: 2px solid red;">
                <p style="margin-top: 0; color: #ff5555; font-weight: bold; animation: piscar 1s infinite;">ALERTA DE
                    FALHA
                    EM CASCATA!</p>
                <p>Código de Segurança: <strong id="codigo-gerado"
                        style="color: yellow; font-size: 18px; letter-spacing: 3px;">----</strong></p>
                <input type="text" id="input-codigo" placeholder="Digite o código" autocomplete="off"
                    style="width: 120px;">
                <button onclick="tentarReboot()">Executar</button>
                <p id="msg-erro-reboot" style="color: #ff5555; font-size: 12px; margin-bottom: 0;"></p>
            </div>
        </div>

        <hr>


        <div class="painel">
            <h2>Mecânica 3: Pressão e Alagamento</h2>
            <p>Nível de Água na Ala: <span id="agua-valor">0</span>%</p>
            <progress id="agua-barra" value="0" max="100" style="width: 300px; accent-color: blue;"></progress>
            <br><br>
            <button id="btn-bomba" onclick="drenarAgua()">Ativar Bomba de Drenagem (-30%)</button>

        </div>

    </div>

    <script>
        let oxigenio = 100;
        let nivelAgua = 0;
        let energiaLigada = true;
        let jogoAtivo = true;
        let codigoAtual = "";

        const telaJogo = document.getElementById('tela-jogo');
        const statusMsg = document.getElementById('status-msg');

        const displayO2 = document.getElementById('o2-valor');
        const barraO2 = document.getElementById('o2-barra');
        const btnValvula = document.getElementById('btn-valvula');

        const energiaStatus = document.getElementById('energia-status');
        const painelReparo = document.getElementById('painel-reparo');
        const displayCodigo = document.getElementById('codigo-gerado');
        const inputCodigo = document.getElementById('input-codigo');
        const msgErroReboot = document.getElementById('msg-erro-reboot');

        const displayAgua = document.getElementById('agua-valor');
        const barraAgua = document.getElementById('agua-barra');
        const btnBomba = document.getElementById('btn-bomba');

        // --- LÓGICA DE O2 (Agravada sem energia) ---
        const loopOxigenio = setInterval(() => {
            if (!jogoAtivo) return;

            // Cai 5 normalmente, mas cai 10 se a energia estiver off
            let taxaQueda = energiaLigada ? 5 : 10;
            oxigenio -= taxaQueda;

            if (oxigenio <= 0) encerrarJogo("FALHA CRÍTICA: ASFIXIA!");
            atualizarInterfaceO2();
        }, 1000);

        // --- LÓGICA DA ÁGUA (Agravada sem energia) ---
        const loopAgua = setInterval(() => {
            if (!jogoAtivo) return;

            // 40% de chance de subir 10. Se sem energia: 70% de chance de subir 20!
            let chanceSubir = energiaLigada ? 0.4 : 0.7;
            let volumeAgua = energiaLigada ? 10 : 20;

            if (Math.random() < chanceSubir) nivelAgua += volumeAgua;

            if (nivelAgua >= 100) encerrarJogo("FALHA CRÍTICA: COLAPSO ESTRUTURAL!");
            atualizarInterfaceAgua();
        }, 1500);

        // --- LÓGICA DE ENERGIA ---
        const loopEnergia = setInterval(() => {
            if (!jogoAtivo) return;

            if (energiaLigada && Math.random() < 0.25) { // Reduzi a chance pra 25% pra ser justo
                energiaLigada = false;

                telaJogo.style.backgroundColor = "#111111";
                telaJogo.style.color = "#777777";
                energiaStatus.innerText = "FALHA - SISTEMA OFFLINE";
                energiaStatus.style.color = "red";

                btnValvula.disabled = true;
                btnBomba.disabled = true;

                codigoAtual = Math.floor(1000 + Math.random() * 9000).toString();
                displayCodigo.innerText = codigoAtual;

                painelReparo.style.display = "block";
                inputCodigo.value = "";
                msgErroReboot.innerText = "";
            }
        }, 2000);

        function girarValvula() {
            if (oxigenio > 0 && energiaLigada) {
                oxigenio = Math.min(100, oxigenio + 20);
                atualizarInterfaceO2();
            }
        }

        function drenarAgua() {
            if (nivelAgua > 0 && energiaLigada) {
                nivelAgua = Math.max(0, nivelAgua - 30);
                atualizarInterfaceAgua();
            }
        }

        function tentarReboot() {
            if (!jogoAtivo) return;

            if (inputCodigo.value === codigoAtual) {
                energiaLigada = true;
                telaJogo.style.backgroundColor = "";
                telaJogo.style.color = "";
                energiaStatus.innerText = "LIGADA";
                energiaStatus.style.color = "green";

                btnValvula.disabled = false;
                btnBomba.disabled = false;
                painelReparo.style.display = "none";
            } else {
                msgErroReboot.innerText = "CÓDIGO INVÁLIDO!";
                inputCodigo.value = "";
                inputCodigo.focus();
            }
        }

        function encerrarJogo(mensagem) {
            jogoAtivo = false;
            oxigenio = Math.max(0, oxigenio);
            nivelAgua = Math.min(100, nivelAgua);
            atualizarInterfaceO2();
            atualizarInterfaceAgua();

            statusMsg.innerText = mensagem;
            btnValvula.disabled = true;
            btnBomba.disabled = true;
            painelReparo.style.display = "none";
        }

        function atualizarInterfaceO2() {
            displayO2.innerText = oxigenio;
            barraO2.value = oxigenio;
        }

        function atualizarInterfaceAgua() {
            displayAgua.innerText = nivelAgua;
            barraAgua.value = nivelAgua;
        }
    </script>
</body>

</html>
