<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Top Down</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="gameContainer">
        <!-- O JavaScript desenha o cenário e o personagem nesta tela. -->
        <canvas id="gameCanvas"></canvas>

        <!-- As instruções mudam quando o personagem entra na casa. -->
        <div id="controls">
            <strong>Controles</strong><br>
            WASD / Setas → Mover
        </div>

        <!-- O JavaScript esconde este aviso quando as imagens carregam. -->
        <div id="loading">Carregando...</div>
    </main>

    <!-- O código roda depois que os elementos da página já existem. -->
    <script src="script.js"></script>
</body>
</html>
