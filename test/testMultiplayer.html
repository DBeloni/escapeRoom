<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Multiplayer - Empurra-Empurra</title>
    <style>
        /* Reset rigoroso */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #e5e5e5;
            width: 100vw;
            height: 100vh;
        }

        #cenario {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, #ccc 1px, transparent 1px),
                linear-gradient(to bottom, #ccc 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .objeto-solido {
            position: absolute;
            z-index: 10;
        }

        /* Jogadores e Obstáculo */
        #jogador1 { background-color: blue; width: 50px; height: 50px; }
        #jogador2 { background-color: green; width: 50px; height: 50px; }
        #jogador3 { background-color: yellow; width: 50px; height: 50px; }
        #jogador4 { background-color: purple; width: 50px; height: 50px; }
        #obstaculo { background-color: red; width: 80px; height: 80px; z-index: 5; }
    </style>
</head>
<body>

    <div id="cenario"></div>
    
    <div id="obstaculo" class="objeto-solido"></div>
    
    <div id="jogador1" class="objeto-solido"></div>
    <div id="jogador2" class="objeto-solido"></div>
    <div id="jogador3" class="objeto-solido"></div>
    <div id="jogador4" class="objeto-solido"></div>

    <script>
        const LARGURA_TELA = window.innerWidth;
        const ALTURA_TELA = window.innerHeight;
        const VELOCIDADE = 6;
        const TAMANHO_JOGADOR = 50;

        const obstaculo = document.getElementById('obstaculo');
        const obs = { x: LARGURA_TELA / 2 - 40, y: ALTURA_TELA / 2 - 40, w: 80, h: 80 };
        obstaculo.style.left = obs.x + 'px';
        obstaculo.style.top = obs.y + 'px';

        const jogadores = [
            { el: document.getElementById('jogador1'), x: 50, y: 50, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 'w', b: 's', e: 'a', d: 'd' } },
            { el: document.getElementById('jogador2'), x: LARGURA_TELA - 100, y: 50, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 't', b: 'g', e: 'f', d: 'h' } },
            { el: document.getElementById('jogador3'), x: 50, y: ALTURA_TELA - 100, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 'i', b: 'k', e: 'j', d: 'l' } },
            { el: document.getElementById('jogador4'), x: LARGURA_TELA - 100, y: ALTURA_TELA - 100, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 'arrowup', b: 'arrowdown', e: 'arrowleft', d: 'arrowright' } }
        ];

        const teclas = {};
        window.addEventListener('keydown', (e) => teclas[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => delete teclas[e.key.toLowerCase()]);

        function colidiu(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 &&
                   x1 + w1 > x2 &&
                   y1 < y2 + h2 &&
                   y1 + h1 > y2;
        }

        function loop() {
            jogadores.forEach((jog, index) => {
                let dx = 0;
                let dy = 0;

                if (teclas[jog.teclas.c]) dy -= VELOCIDADE;
                if (teclas[jog.teclas.b]) dy += VELOCIDADE;
                if (teclas[jog.teclas.e]) dx -= VELOCIDADE;
                if (teclas[jog.teclas.d]) dx += VELOCIDADE;

                // --- MOVIMENTO X ---
                if (dx !== 0) {
                    let novoX = jog.x + dx;
                    let podeMover = true;
                    let jogadoresParaEmpurrar = [];

                    // Borda da tela e Obstáculo para o jogador atual
                    if (novoX < 0 || novoX + jog.w > LARGURA_TELA) podeMover = false;
                    if (podeMover && colidiu(novoX, jog.y, jog.w, jog.h, obs.x, obs.y, obs.w, obs.h)) podeMover = false;

                    if (podeMover) {
                        for (let i = 0; i < jogadores.length; i++) {
                            if (i !== index) {
                                let outro = jogadores[i];
                                // Se bati em outro jogador...
                                if (colidiu(novoX, jog.y, jog.w, jog.h, outro.x, outro.y, outro.w, outro.h)) {
                                    
                                    let outroNovoX = outro.x + dx;
                                    let outroPodeMover = true;

                                    // Verifica se o outro jogador pode ser empurrado para a nova posição
                                    if (outroNovoX < 0 || outroNovoX + outro.w > LARGURA_TELA) outroPodeMover = false;
                                    if (colidiu(outroNovoX, outro.y, outro.w, outro.h, obs.x, obs.y, obs.w, obs.h)) outroPodeMover = false;

                                    // Verifica se o outro jogador não vai bater em um TERCEIRO jogador (sem trenzinhos)
                                    for (let j = 0; j < jogadores.length; j++) {
                                        if (j !== index && j !== i) {
                                            let terceiro = jogadores[j];
                                            if (colidiu(outroNovoX, outro.y, outro.w, outro.h, terceiro.x, terceiro.y, terceiro.w, terceiro.h)) {
                                                outroPodeMover = false;
                                            }
                                        }
                                    }

                                    if (outroPodeMover) {
                                        jogadoresParaEmpurrar.push(outro);
                                    } else {
                                        podeMover = false; // Se ele não pode se mover, eu também não posso
                                        break;
                                    }
                                }
                            }
                        }
                    }

                    if (podeMover) {
                        jog.x = novoX;
                        // Aplica o movimento nos jogadores que foram empurrados
                        jogadoresParaEmpurrar.forEach(j => j.x += dx);
                    }
                }

                // --- MOVIMENTO Y ---
                if (dy !== 0) {
                    let novoY = jog.y + dy;
                    let podeMover = true;
                    let jogadoresParaEmpurrar = [];

                    // Borda da tela e Obstáculo para o jogador atual
                    if (novoY < 0 || novoY + jog.h > ALTURA_TELA) podeMover = false;
                    if (podeMover && colidiu(jog.x, novoY, jog.w, jog.h, obs.x, obs.y, obs.w, obs.h)) podeMover = false;

                    if (podeMover) {
                        for (let i = 0; i < jogadores.length; i++) {
                            if (i !== index) {
                                let outro = jogadores[i];
                                if (colidiu(jog.x, novoY, jog.w, jog.h, outro.x, outro.y, outro.w, outro.h)) {
                                    
                                    let outroNovoY = outro.y + dy;
                                    let outroPodeMover = true;

                                    if (outroNovoY < 0 || outroNovoY + outro.h > ALTURA_TELA) outroPodeMover = false;
                                    if (colidiu(outro.x, outroNovoY, outro.w, outro.h, obs.x, obs.y, obs.w, obs.h)) outroPodeMover = false;

                                    for (let j = 0; j < jogadores.length; j++) {
                                        if (j !== index && j !== i) {
                                            let terceiro = jogadores[j];
                                            if (colidiu(outro.x, outroNovoY, outro.w, outro.h, terceiro.x, terceiro.y, terceiro.w, terceiro.h)) {
                                                outroPodeMover = false;
                                            }
                                        }
                                    }

                                    if (outroPodeMover) {
                                        jogadoresParaEmpurrar.push(outro);
                                    } else {
                                        podeMover = false;
                                        break;
                                    }
                                }
                            }
                        }
                    }

                    if (podeMover) {
                        jog.y = novoY;
                        jogadoresParaEmpurrar.forEach(j => j.y += dy);
                    }
                }

                // Renderiza na tela
                jog.el.style.left = jog.x + 'px';
                jog.el.style.top = jog.y + 'px';
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
