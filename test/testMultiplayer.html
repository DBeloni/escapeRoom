<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Multiplayer Local</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-color: #e5e5e5;
        }

        #cenario {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(to right, #ccc 1px, transparent 1px),
                linear-gradient(to bottom, #ccc 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Estilo base para os jogadores */
        .jogador {
            width: 50px;
            height: 50px;
            position: absolute;
            z-index: 10;
            border-radius: 8px; /* Cantos levemente arredondados para um visual mais agradável */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        #obstaculo {
            width: 80px;
            height: 80px;
            background-color: red;
            position: absolute;
            z-index: 5;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(255, 0, 0, 0.4);
        }

        /* Instruções na tela */
        #instrucoes {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
    <div id="cenario"></div>
    <div id="obstaculo"></div>
    
    <div id="instrucoes">
        <strong>P1 (Azul):</strong> WASD | 
        <strong>P2 (Verde):</strong> TFGH | 
        <strong>P3 (Amarelo):</strong> IJKL | 
        <strong>P4 (Roxo):</strong> Setas
    </div>

    <script>
        const obstaculoElement = document.getElementById('obstaculo');
        
        // Tamanho padrão do jogador
        const tamanhoJogador = 50;
        const velocidade = 6;

        // Configuração do obstáculo (centro da tela)
        const obs = {
            largura: 80,
            altura: 80,
            x: window.innerWidth / 2 - 40,
            y: window.innerHeight / 2 - 40
        };

        // Posiciona o obstáculo inicialmente
        obstaculoElement.style.left = obs.x + 'px';
        obstaculoElement.style.top = obs.y + 'px';

        // Definição dos 4 jogadores
        const jogadores = [
            { id: 'p1', cor: 'blue', x: 50, y: 50, teclas: { up: 'w', left: 'a', down: 's', right: 'd' } },
            { id: 'p2', cor: 'green', x: window.innerWidth - 100, y: 50, teclas: { up: 't', left: 'f', down: 'g', right: 'h' } },
            { id: 'p3', cor: 'yellow', x: 50, y: window.innerHeight - 100, teclas: { up: 'i', left: 'j', down: 'k', right: 'l' } },
            { id: 'p4', cor: 'purple', x: window.innerWidth - 100, y: window.innerHeight - 100, teclas: { up: 'arrowup', left: 'arrowleft', down: 'arrowdown', right: 'arrowright' } }
        ];

        jogadores.forEach(j => {
            const el = document.createElement('div');
            el.id = j.id;
            el.className = 'jogador';
            el.style.backgroundColor = j.cor;
            el.style.left = j.x + 'px';
            el.style.top = j.y + 'px';
            document.body.appendChild(el);
            j.elemento = el; // Guarda a referência do DOM no objeto do jogador
        });

        const teclas = {};

        window.addEventListener('keydown', (e) => {
            teclas[e.key.toLowerCase()] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            delete teclas[e.key.toLowerCase()];
        });

        // Recalcular obstáculo e limites se a janela for redimensionada
        window.addEventListener('resize', () => {
            obs.x = window.innerWidth / 2 - obs.largura / 2;
            obs.y = window.innerHeight / 2 - obs.altura / 2;
            obstaculoElement.style.left = obs.x + 'px';
            obstaculoElement.style.top = obs.y + 'px';
        });

        const loop = () => {
            jogadores.forEach(j => {
                let proximoX = j.x;
                let proximoY = j.y;

                // Move com base nas teclas do jogador específico
                if (teclas[j.teclas.up]) proximoY -= velocidade;
                if (teclas[j.teclas.down]) proximoY += velocidade;
                if (teclas[j.teclas.left]) proximoX -= velocidade;
                if (teclas[j.teclas.right]) proximoX += velocidade;

                // TRAVA DE LIMITE DA TELA (Mundo estático)
                const limiteMaxX = window.innerWidth - tamanhoJogador;
                const limiteMaxY = window.innerHeight - tamanhoJogador;

                if (proximoX < 0) proximoX = 0;
                if (proximoX > limiteMaxX) proximoX = limiteMaxX;
                if (proximoY < 0) proximoY = 0;
                if (proximoY > limiteMaxY) proximoY = limiteMaxY;

                // DETECÇÃO DE COLISÃO COM O OBSTÁCULO VERMELHO
                const bateuNoObstaculo =
                    proximoX < obs.x + obs.largura &&
                    proximoX + tamanhoJogador > obs.x &&
                    proximoY < obs.y + obs.altura &&
                    proximoY + tamanhoJogador > obs.y;

                // Atualiza posição se não colidir
                if (!bateuNoObstaculo) {
                    j.x = proximoX;
                    j.y = proximoY;
                }

                // Atualiza a posição visual na tela
                j.elemento.style.left = j.x + 'px';
                j.elemento.style.top = j.y + 'px';
            });

            requestAnimationFrame(loop);
        };

        loop();
    </script>
</body>

</html>
