<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Multiplayer - Câmera Dinâmica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #111;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #instrucoes {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instrucoes">
        <strong>P1 (Azul):</strong> W A S D | <strong>P2 (Verde):</strong> Setas<br>
        Afaste-se para dividir a tela.
    </div>

    <canvas id="jogo"></canvas>

    <script>
        const canvas = document.getElementById('jogo');
        const ctx = canvas.getContext('2d');

        // Configurações do Mundo (Pode ser maior que a tela)
        const mundo = { largura: 3000, altura: 2000 };
        const VELOCIDADE = 6;
        const TAMANHO_JOGADOR = 50;

        // Ajusta o canvas para o tamanho da janela
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        // Entidades
        const obstaculo = { x: mundo.largura / 2 - 40, y: mundo.altura / 2 - 40, w: 80, h: 80 };
        
        const jogadores = [
            { id: 1, cor: 'blue', x: mundo.largura / 2 - 100, y: mundo.altura / 2, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 'w', b: 's', e: 'a', d: 'd' } },
            { id: 2, cor: 'green', x: mundo.largura / 2 + 100, y: mundo.altura / 2, w: TAMANHO_JOGADOR, h: TAMANHO_JOGADOR, teclas: { c: 'arrowup', b: 'arrowdown', e: 'arrowleft', d: 'arrowright' } }
        ];

        const teclas = {};
        window.addEventListener('keydown', (e) => teclas[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => delete teclas[e.key.toLowerCase()]);

        function colidiu(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function atualizarFisica() {
            jogadores.forEach((jog, index) => {
                let dx = 0;
                let dy = 0;

                if (teclas[jog.teclas.c]) dy -= VELOCIDADE;
                if (teclas[jog.teclas.b]) dy += VELOCIDADE;
                if (teclas[jog.teclas.e]) dx -= VELOCIDADE;
                if (teclas[jog.teclas.d]) dx += VELOCIDADE;

                // Movimento X
                if (dx !== 0) {
                    let novoX = jog.x + dx;
                    let podeMover = true;

                    // Colisão com bordas do mundo e obstáculo
                    if (novoX < 0 || novoX + jog.w > mundo.largura) podeMover = false;
                    if (podeMover && colidiu(novoX, jog.y, jog.w, jog.h, obstaculo.x, obstaculo.y, obstaculo.w, obstaculo.h)) podeMover = false;

                    // Colisão e empurrão entre jogadores
                    if (podeMover) {
                        let outro = jogadores[index === 0 ? 1 : 0];
                        if (colidiu(novoX, jog.y, jog.w, jog.h, outro.x, outro.y, outro.w, outro.h)) {
                            let outroNovoX = outro.x + dx;
                            if (outroNovoX < 0 || outroNovoX + outro.w > mundo.largura || 
                                colidiu(outroNovoX, outro.y, outro.w, outro.h, obstaculo.x, obstaculo.y, obstaculo.w, obstaculo.h)) {
                                podeMover = false;
                            } else {
                                outro.x += dx;
                            }
                        }
                    }
                    if (podeMover) jog.x = novoX;
                }

                // Movimento Y
                if (dy !== 0) {
                    let novoY = jog.y + dy;
                    let podeMover = true;

                    if (novoY < 0 || novoY + jog.h > mundo.altura) podeMover = false;
                    if (podeMover && colidiu(jog.x, novoY, jog.w, jog.h, obstaculo.x, obstaculo.y, obstaculo.w, obstaculo.h)) podeMover = false;

                    if (podeMover) {
                        let outro = jogadores[index === 0 ? 1 : 0];
                        if (colidiu(jog.x, novoY, jog.w, jog.h, outro.x, outro.y, outro.w, outro.h)) {
                            let outroNovoY = outro.y + dy;
                            if (outroNovoY < 0 || outroNovoY + outro.h > mundo.altura || 
                                colidiu(outro.x, outroNovoY, outro.w, outro.h, obstaculo.x, obstaculo.y, obstaculo.w, obstaculo.h)) {
                                podeMover = false;
                            } else {
                                outro.y += dy;
                            }
                        }
                    }
                    if (podeMover) jog.y = novoY;
                }
            });
        }

        // Desenha o mundo inteiro relativo à câmera atual
        function desenharMundo() {
            // Chão e Grid
            ctx.fillStyle = '#e5e5e5';
            ctx.fillRect(0, 0, mundo.largura, mundo.altura);
            
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= mundo.largura; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, mundo.altura); }
            for (let y = 0; y <= mundo.altura; y += 40) { ctx.moveTo(0, y); ctx.lineTo(mundo.largura, y); }
            ctx.stroke();

            // Bordas do mundo
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, mundo.largura, mundo.altura);

            // Obstáculo
            ctx.fillStyle = 'red';
            ctx.fillRect(obstaculo.x, obstaculo.y, obstaculo.w, obstaculo.h);

            // Jogadores
            jogadores.forEach(jog => {
                ctx.fillStyle = jog.cor;
                ctx.fillRect(jog.x, jog.y, jog.w, jog.h);
            });
        }

        // Renderiza uma janela de visualização específica (Viewport)
        function renderizarViewport(x_tela, y_tela, largura_tela, altura_tela, alvoX, alvoY) {
            ctx.save();
            
            // Define a área de corte na tela
            ctx.beginPath();
            ctx.rect(x_tela, y_tela, largura_tela, altura_tela);
            ctx.clip();

            // Centraliza a câmera no alvo
            let camX = alvoX - (largura_tela / 2);
            let camY = alvoY - (altura_tela / 2);

            // Evita que a câmera mostre áreas fora do mundo (opcional)
            camX = Math.max(0, Math.min(camX, mundo.largura - largura_tela));
            camY = Math.max(0, Math.min(camY, mundo.altura - altura_tela));

            ctx.translate(x_tela - camX, y_tela - camY);
            
            desenharMundo();
            
            ctx.restore();
        }

        function loop() {
            atualizarFisica();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const j1 = jogadores[0];
            const j2 = jogadores[1];

            // Calcula distância entre os jogadores
            const distanciaX = Math.abs(j1.x - j2.x);
            const distanciaY = Math.abs(j1.y - j2.y);
            
            // Limites para a tela dividir (ajustável conforme necessidade)
            const limiteX = canvas.width * 0.45; 
            const limiteY = canvas.height * 0.45;

            if (distanciaX > limiteX || distanciaY > limiteY) {
                // TELA DIVIDIDA
                // Viewport Esquerdo (Jogador 1)
                renderizarViewport(0, 0, canvas.width / 2, canvas.height, j1.x + (j1.w/2), j1.y + (j1.h/2));
                
                // Viewport Direito (Jogador 2)
                renderizarViewport(canvas.width / 2, 0, canvas.width / 2, canvas.height, j2.x + (j2.w/2), j2.y + (j2.h/2));

                // Desenha a linha divisória no centro
                ctx.fillStyle = '#222';
                ctx.fillRect((canvas.width / 2) - 3, 0, 6, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect((canvas.width / 2) - 1, 0, 2, canvas.height);
            } else {
                // TELA UNIFICADA
                // Câmera foca no ponto central entre os dois jogadores
                const centroX = (j1.x + j2.x + j1.w) / 2;
                const centroY = (j1.y + j2.y + j1.h) / 2;
                renderizarViewport(0, 0, canvas.width, canvas.height, centroX, centroY);
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
